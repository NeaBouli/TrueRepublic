version: "3.8"

services:
  # ---- Blockchain Node ----
  truerepublic-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truerepublic-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:${P2P_PORT:-26656}:26656"
      - "127.0.0.1:8080:80"
      - "127.0.0.1:9091:9090"
      - "127.0.0.1:3001:8080"
    volumes:
      - node-data:/home/truerepublic/.truerepublic
    environment:
      - MONIKER=${MONIKER:-truerepublic-node}
      - CHAIN_ID=${CHAIN_ID:-truerepublic-1}
      - MIN_GAS_PRICE=${MIN_GAS_PRICE:-1000upnyx}
      - BOOTSTRAP_OPERATOR=${BOOTSTRAP_OPERATOR}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-false}
    command:
      - start
      - --log_format=json
      - --rpc.laddr=tcp://127.0.0.1:26657
      - --grpc.enable=false
      - --api.enable=true
      - --api.address=tcp://127.0.0.1:1317
      - --minimum-gas-prices=${MIN_GAS_PRICE:-1000upnyx}
    networks:
      - truerepublic-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---- Client Web (maintained frontend) ----
  client-web:
    build:
      context: ./client-web
      dockerfile: Dockerfile
    container_name: truerepublic-client-web
    restart: unless-stopped
    depends_on:
      - truerepublic-node
    network_mode: "service:truerepublic-node"

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: truerepublic-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - truerepublic-node
      - client-web
    network_mode: "service:truerepublic-node"

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: truerepublic-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    network_mode: "service:truerepublic-node"

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    container_name: truerepublic-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - truerepublic-net

volumes:
  node-data:
  prometheus-data:
  grafana-data:

networks:
  truerepublic-net:
    driver: bridge
