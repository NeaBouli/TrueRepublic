version: "3.8"

services:
  # ---- Blockchain Node ----
  truerepublic-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truerepublic-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:${P2P_PORT:-26656}:26656"
      - "127.0.0.1:8080:80"
      - "127.0.0.1:9091:9090"
    volumes:
      - node-data:/home/truerepublic/.truerepublic
    environment:
      - MONIKER=${MONIKER:-truerepublic-node}
      - CHAIN_ID=${CHAIN_ID:-truerepublic-1}
      - MIN_GAS_PRICE=${MIN_GAS_PRICE:-1000upnyx}
      - BOOTSTRAP_OPERATOR=${BOOTSTRAP_OPERATOR}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-false}
    command:
      - start
      - --rpc.laddr=tcp://127.0.0.1:26657
      - --grpc.enable=false
      - --api.enable=true
      - --api.address=tcp://127.0.0.1:1317
      - --minimum-gas-prices=${MIN_GAS_PRICE:-1000upnyx}
    networks:
      - truerepublic-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---- Web Wallet ----
  web-wallet:
    build:
      context: ./web-wallet
      dockerfile: Dockerfile
    container_name: truerepublic-web-wallet
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - truerepublic-node
    networks:
      - truerepublic-net

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: truerepublic-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - truerepublic-node
      - web-wallet
    network_mode: "service:truerepublic-node"

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: truerepublic-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    network_mode: "service:truerepublic-node"

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: truerepublic-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - truerepublic-net

volumes:
  node-data:
  prometheus-data:
  grafana-data:

networks:
  truerepublic-net:
    driver: bridge
