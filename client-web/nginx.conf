worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=client_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=client_rpc:10m rate=10r/s;

    access_log /dev/stdout;

    # Non-root runtime: keep all writable paths under /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA routing: serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ^~ /rpc/ {
            limit_req zone=client_rpc burst=20 nodelay;
            rewrite ^/rpc/(.*) /$1 break;
            proxy_pass http://127.0.0.1:26657;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /rpc {
            limit_req zone=client_rpc burst=20 nodelay;
            proxy_pass http://127.0.0.1:26657/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/metrics(?:/|$) {
            return 404;
        }

        location ^~ /api/ {
            limit_req zone=client_api burst=50 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:1317;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /api {
            limit_req zone=client_api burst=50 nodelay;
            proxy_pass http://127.0.0.1:1317/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Cache static assets (30 days)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Do not cache index.html (SPA entry point must be fresh)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
