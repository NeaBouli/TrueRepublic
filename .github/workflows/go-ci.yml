name: Go CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/go-ci.yml'
      - 'docker-compose.yml'
      - 'monitoring/**'
      - 'nginx/**'
      - 'scripts/backup.sh'
      - 'scripts/docker-entrypoint.sh'
      - 'scripts/go-packages.sh'
      - 'scripts/init-node.sh'
      - 'scripts/restore.sh'
      - 'scripts/test-go-packages.sh'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/go-ci.yml'
      - 'docker-compose.yml'
      - 'monitoring/**'
      - 'nginx/**'
      - 'scripts/backup.sh'
      - 'scripts/docker-entrypoint.sh'
      - 'scripts/go-packages.sh'
      - 'scripts/init-node.sh'
      - 'scripts/restore.sh'
      - 'scripts/test-go-packages.sh'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Verify repository Go package selection
        run: ./scripts/test-go-packages.sh

      - name: Build
        run: CGO_ENABLED=1 ./scripts/go-packages.sh go build

      - name: Vet
        run: ./scripts/go-packages.sh go vet

      - name: Test
        run: CGO_ENABLED=1 ./scripts/go-packages.sh go test -race -cover -count=1 -timeout=600s

  multi-validator-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Run multi-validator recovery, migration, slashing, rotation, state-sync, backup/restore, identity-recovery, and upgrade/rollback harnesses
        env:
          TRUEREPUBLIC_MULTI_VALIDATOR_SMOKE: '1'
        run: go test . -run '^(TestMultiValidatorConsensusRecovery|TestMultiValidatorLegacyAuthorityMigrationRollback|TestMultiValidatorConsensusSlashing|TestMultiValidatorConsensusKeyRotation|TestMultiValidatorTrustedSnapshotStateSync|TestMultiValidatorBackupRestoreExportImport|TestMultiValidatorPersistedBinaryUpgradeRollback|TestValidatorIdentityColdFailover)$' -count=1 -timeout=1500s -v

  docker-restart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

      - name: Validate Prometheus configuration and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/monitoring:/etc/prometheus:ro" \
            --workdir /etc/prometheus \
            prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/monitoring:/etc/prometheus:ro" \
            --workdir /etc/prometheus \
            prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            test rules /etc/prometheus/prometheus-alerts.test.yml

      - name: Build node image
        run: docker build --build-arg VERSION="${GITHUB_SHA}" --tag truerepublic-node:ci .

      - name: Start node container
        run: >-
          docker run --detach --name truerepublic-node-ci
          -e BOOTSTRAP_OPERATOR=truerepublic13hgqwy9986x5nk6jt23ns5v7j0acs8qmhchhtw
          truerepublic-node:ci

      - name: Wait for node liveness
        run: |
          for attempt in $(seq 1 60); do
            if docker exec truerepublic-node-ci truerepublicd healthcheck live --timeout 2s; then
              exit 0
            fi
            sleep 2
          done
          docker logs truerepublic-node-ci
          exit 1

      - name: Wait for first committed block
        id: first
        run: |
          for attempt in $(seq 1 60); do
            if docker exec truerepublic-node-ci truerepublicd healthcheck ready --timeout 2s; then
              height=$(docker exec truerepublic-node-ci wget -qO- http://127.0.0.1:26657/status | jq -r '.result.sync_info.latest_block_height // 0' || true)
              if [ "${height:-0}" -ge 1 ]; then
                echo "height=${height}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs truerepublic-node-ci
          exit 1

      - name: Restart persistent container
        id: restart
        run: |
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          docker restart truerepublic-node-ci

      - name: Verify height advances after restart
        env:
          FIRST_HEIGHT: ${{ steps.first.outputs.height }}
        run: |
          for attempt in $(seq 1 60); do
            if docker exec truerepublic-node-ci truerepublicd healthcheck live --timeout 2s &&
              docker exec truerepublic-node-ci truerepublicd healthcheck ready --timeout 2s; then
              height=$(docker exec truerepublic-node-ci wget -qO- http://127.0.0.1:26657/status | jq -r '.result.sync_info.latest_block_height // 0' || true)
            else
              height=0
            fi
            if [ "${height:-0}" -gt "${FIRST_HEIGHT:-0}" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs truerepublic-node-ci
          exit 1

      - name: Verify structured logs after restart
        env:
          LOGS_SINCE: ${{ steps.restart.outputs.since }}
        run: |
          docker logs --since "$LOGS_SINCE" truerepublic-node-ci > node-logs.jsonl 2>&1
          test -s node-logs.jsonl
          while IFS= read -r line; do
            printf '%s\n' "$line" |
              jq -e 'type == "object" and
                (.level | type == "string") and
                (.message | type == "string")' >/dev/null
          done < node-logs.jsonl

      - name: Show node logs on failure
        if: failure()
        run: docker logs truerepublic-node-ci || true

      - name: Remove node container
        if: always()
        run: docker rm --force truerepublic-node-ci || true

      - name: Start loopback Compose stack
        env:
          BOOTSTRAP_OPERATOR: truerepublic13hgqwy9986x5nk6jt23ns5v7j0acs8qmhchhtw
          GRAFANA_PASSWORD: ci-compose-validation-only
          PROMETHEUS_ENABLED: 'true'
        run: docker compose up --detach --build truerepublic-node web-wallet nginx prometheus grafana

      - name: Verify proxy and same-namespace metrics
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: |
          for attempt in $(seq 1 90); do
            rpc_ok=false
            wallet_ok=false
            metrics_ok=false
            app_metrics_ok=false
            grafana_ok=false
            live_ok=false
            ready_ok=false
            metrics_proxy_blocked=false
            metrics_descendant_proxy_blocked=false
            curl --fail --silent http://127.0.0.1:8080/rpc/status >/dev/null && rpc_ok=true
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && wallet_ok=true
            docker compose exec -T truerepublic-node truerepublicd healthcheck live --timeout 2s &&
              live_ok=true
            docker compose exec -T truerepublic-node truerepublicd healthcheck ready --timeout 2s &&
              ready_ok=true
            if curl --fail --silent http://127.0.0.1:9091/api/v1/targets |
              jq -e '.data.activeTargets[] | select(.labels.job == "truerepublic-node" and .health == "up")' >/dev/null; then
              metrics_ok=true
            fi
            if curl --fail --silent http://127.0.0.1:9091/api/v1/targets |
              jq -e '.data.activeTargets[] | select(.labels.job == "truerepublic-app" and .health == "up")' >/dev/null; then
              app_metrics_ok=true
            fi
            curl --fail --silent http://127.0.0.1:3000/api/health |
              jq -e '.database == "ok"' >/dev/null && grafana_ok=true
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8080/api/metrics?format=prometheus)" = "404" ]; then
              metrics_proxy_blocked=true
            fi
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8080/api/metrics/)" = "404" ]; then
              metrics_descendant_proxy_blocked=true
            fi
            if [ "$rpc_ok" = true ] && [ "$wallet_ok" = true ] &&
              [ "$live_ok" = true ] && [ "$ready_ok" = true ] &&
              [ "$metrics_ok" = true ] && [ "$app_metrics_ok" = true ] &&
              [ "$grafana_ok" = true ] && [ "$metrics_proxy_blocked" = true ] &&
              [ "$metrics_descendant_proxy_blocked" = true ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Verify provisioned dashboard, rules, and panel queries
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: |
          dashboard=$(curl --fail --silent --show-error \
            --user "admin:${GRAFANA_PASSWORD}" \
            http://127.0.0.1:3000/api/dashboards/uid/truerepublic-blockchain)
          if ! printf '%s\n' "$dashboard" |
            jq -e '
              .dashboard.uid == "truerepublic-blockchain" and
              .meta.folderTitle == "TrueRepublic" and
              (.dashboard.panels | length == 16) and
              ([.dashboard.panels[].targets[]?.expr] | length == 17)
            ' >/dev/null; then
            printf '%s\n' "$dashboard" |
              jq -c '{
                uid: .dashboard.uid,
                folder: .meta.folderTitle,
                panels: (.dashboard.panels | length),
                targets: ([.dashboard.panels[].targets[]?.expr] | length)
              }'
            echo "::error title=Grafana dashboard contract::Unexpected provisioned dashboard identity or shape"
            exit 1
          fi

          datasource=$(curl --fail --silent --show-error \
            --user "admin:${GRAFANA_PASSWORD}" \
            http://127.0.0.1:3000/api/datasources/uid/truerepublic-prometheus)
          if ! printf '%s\n' "$datasource" |
            jq -e '
              .uid == "truerepublic-prometheus" and
              .name == "Prometheus" and
              .type == "prometheus" and
              .url == "http://truerepublic-node:9090"
            ' >/dev/null; then
            printf '%s\n' "$datasource" |
              jq -c '{uid, name, type, url}'
            echo "::error title=Grafana datasource contract::Unexpected provisioned datasource identity or URL"
            exit 1
          fi

          proxy_ok=false
          for _ in $(seq 1 15); do
            proxy_result=$(curl --fail --silent --show-error --get \
              --user "admin:${GRAFANA_PASSWORD}" \
              --data-urlencode 'query=truerepublic_app_last_successful_block_height{job="truerepublic-app"}' \
              http://127.0.0.1:3000/api/datasources/proxy/uid/truerepublic-prometheus/api/v1/query)
            if printf '%s\n' "$proxy_result" |
              jq -e '.status == "success" and (.data.result | length == 1)' >/dev/null; then
              proxy_ok=true
              break
            fi
            sleep 2
          done
          if [ "$proxy_ok" != true ]; then
            printf '%s\n' "$proxy_result" |
              jq -c '{status, errorType, error, result_count: (.data.result | length?)}'
            echo "::error title=Grafana datasource query::Expected one application-height series through the datasource proxy"
            exit 1
          fi

          rules_ok=false
          for _ in $(seq 1 15); do
            rules=$(curl --fail --silent --show-error \
              'http://127.0.0.1:9091/api/v1/rules?type=alert')
            if printf '%s\n' "$rules" |
              jq -e '
                .status == "success" and
                ([.data.groups[].rules[] |
                  select(.type == "alerting" and .health == "ok")] |
                  length == 11)
              ' >/dev/null; then
              rules_ok=true
              break
            fi
            sleep 2
          done
          if [ "$rules_ok" != true ]; then
            printf '%s\n' "$rules" |
              jq -c '{
                status,
                alerting: ([.data.groups[].rules[] | select(.type == "alerting")] | length),
                healthy: ([.data.groups[].rules[] | select(.type == "alerting" and .health == "ok")] | length),
                unhealthy: [.data.groups[].rules[] |
                  select(.type == "alerting" and .health != "ok") |
                  {name, health, lastError}]
              }'
            echo "::error title=Prometheus alert contract::Expected eleven healthy alerting rules"
            exit 1
          fi

          printf '%s\n' "$dashboard" |
            jq -r '.dashboard.panels[].targets[]?.expr' |
            while IFS= read -r expression; do
              test -n "$expression"
              query_result=$(curl --fail --silent --show-error --get \
                --data-urlencode "query=${expression}" \
                http://127.0.0.1:9091/api/v1/query)
              if ! printf '%s\n' "$query_result" |
                jq -e '.status == "success"' >/dev/null; then
                printf '%s\n' "$query_result" |
                  jq -c '{status, errorType, error}'
                echo "::error title=Dashboard PromQL::Query failed: ${expression}"
                exit 1
              fi
            done

          for expression in \
            'avg_over_time(up{job=~"truerepublic-(node|app)"}[7d])' \
            'avg_over_time((changes(cometbft_consensus_height{job="truerepublic-node"}[5m]) > bool 0)[7d:5m])' \
            'avg_over_time((increase(truerepublic_app_completed_blocks_total{job="truerepublic-app"}[5m]) > bool 0)[7d:5m])' \
            'avg_over_time((truerepublic_app_last_successful_invariant_cycle_height{job="truerepublic-app"} == bool truerepublic_app_last_successful_block_height{job="truerepublic-app"})[7d:1m])' \
            'min_over_time(truerepublic_token_pnyx_supply_headroom_base_units{job="truerepublic-app"}[7d]) >= 0' \
            'max_over_time(truerepublic_token_pnyx_supply_base_units{job="truerepublic-app"}[7d]) <= 21000000000000'; do
            query_result=$(curl --fail --silent --show-error --get \
              --data-urlencode "query=${expression}" \
              http://127.0.0.1:9091/api/v1/query)
            if ! printf '%s\n' "$query_result" |
              jq -e '.status == "success"' >/dev/null; then
              printf '%s\n' "$query_result" |
                jq -c '{status, errorType, error}'
              echo "::error title=Service-objective PromQL::Query failed: ${expression}"
              exit 1
            fi
          done

          for expression in \
            'truerepublic_app_last_successful_block_height' \
            'truerepublic_app_last_successful_invariant_cycle_height' \
            'truerepublic_token_pnyx_supply_base_units' \
            'truerepublic_token_pnyx_supply_headroom_base_units'; do
            metric_ok=false
            for _ in $(seq 1 15); do
              query_result=$(curl --fail --silent --show-error --get \
                --data-urlencode "query=${expression}" \
                http://127.0.0.1:9091/api/v1/query)
              if printf '%s\n' "$query_result" |
                jq -e '.status == "success" and (.data.result | length == 1)' >/dev/null; then
                metric_ok=true
                break
              fi
              sleep 2
            done
            if [ "$metric_ok" != true ]; then
              printf '%s\n' "$query_result" |
                jq -c '{status, errorType, error, result_count: (.data.result | length?)}'
              echo "::error title=Application metric contract::Expected one series for ${expression}"
              exit 1
            fi
          done

      - name: Verify metrics contract and restart progression
        env:
          BOOTSTRAP_OPERATOR: truerepublic13hgqwy9986x5nk6jt23ns5v7j0acs8qmhchhtw
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: |
          require_metric() {
            file="$1"
            metric="$2"
            if awk -v metric="$metric" \
              '!/^#/ && NF >= 2 {
                name=$1
                sub(/\{.*/, "", name)
                if (name == metric) {
                  found=1
                }
              }
              END { exit !found }' "$file"; then
              return 0
            fi
            echo "::error::required metric ${metric} is missing from ${file}"
            awk '!/^#/ && NF >= 2 { name=$1; sub(/\{.*/, "", name); print name }' "$file" |
              sort -u
            return 1
          }

          docker compose exec -T truerepublic-node \
            wget -qO- http://127.0.0.1:26660/metrics > comet-metrics.prom
          for metric in \
            cometbft_consensus_height \
            cometbft_mempool_size \
            cometbft_consensus_block_interval_seconds_sum \
            cometbft_consensus_block_interval_seconds_count; do
            require_metric comet-metrics.prom "$metric"
          done

          docker compose exec -T truerepublic-node \
            wget -qO- 'http://127.0.0.1:1317/metrics?format=prometheus' > app-metrics-before.prom
          for metric in \
            go_goroutines \
            process_resident_memory_bytes \
            truerepublic_app_last_successful_block_height \
            truerepublic_app_completed_blocks_total \
            truerepublic_app_last_successful_invariant_cycle_height \
            truerepublic_token_pnyx_supply_base_units \
            truerepublic_token_pnyx_supply_headroom_base_units; do
            require_metric app-metrics-before.prom "$metric"
          done

          first_height=$(awk '$1 == "truerepublic_app_last_successful_block_height" { print $2; exit }' app-metrics-before.prom)
          first_invariant=$(awk '$1 == "truerepublic_app_last_successful_invariant_cycle_height" { print $2; exit }' app-metrics-before.prom)
          supply=$(awk '$1 == "truerepublic_token_pnyx_supply_base_units" { print $2; exit }' app-metrics-before.prom)
          headroom=$(awk '$1 == "truerepublic_token_pnyx_supply_headroom_base_units" { print $2; exit }' app-metrics-before.prom)
          echo "metrics contract: height=${first_height} invariant=${first_invariant} supply=${supply} headroom=${headroom}"
          awk -v height="$first_height" -v invariant="$first_invariant" \
            'BEGIN { exit !(height >= 1 && invariant == height) }'
          awk -v supply="$supply" -v headroom="$headroom" \
            'BEGIN { exit !(supply >= 0 && headroom >= 0 && supply + headroom == 21000000000000) }'

          docker compose restart truerepublic-node
          for attempt in $(seq 1 90); do
            if docker compose exec -T truerepublic-node \
              truerepublicd healthcheck ready --timeout 2s &&
              docker compose exec -T truerepublic-node \
              wget -qO- 'http://127.0.0.1:1317/metrics?format=prometheus' > app-metrics-after.prom; then
              next_height=$(awk '$1 == "truerepublic_app_last_successful_block_height" { print $2; exit }' app-metrics-after.prom)
              next_invariant=$(awk '$1 == "truerepublic_app_last_successful_invariant_cycle_height" { print $2; exit }' app-metrics-after.prom)
              if awk -v before="$first_height" -v after="$next_height" -v invariant="$next_invariant" \
                'BEGIN { exit !(after > before && invariant == after) }'; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop Compose stack
        if: always()
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: docker compose down --volumes --remove-orphans
