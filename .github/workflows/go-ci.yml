name: Go CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/go-ci.yml'
      - 'docker-compose.yml'
      - 'scripts/backup.sh'
      - 'scripts/docker-entrypoint.sh'
      - 'scripts/go-packages.sh'
      - 'scripts/restore.sh'
      - 'scripts/test-go-packages.sh'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/go-ci.yml'
      - 'docker-compose.yml'
      - 'scripts/backup.sh'
      - 'scripts/docker-entrypoint.sh'
      - 'scripts/go-packages.sh'
      - 'scripts/restore.sh'
      - 'scripts/test-go-packages.sh'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Verify repository Go package selection
        run: ./scripts/test-go-packages.sh

      - name: Build
        run: CGO_ENABLED=1 ./scripts/go-packages.sh go build

      - name: Vet
        run: ./scripts/go-packages.sh go vet

      - name: Test
        run: CGO_ENABLED=1 ./scripts/go-packages.sh go test -race -cover -count=1 -timeout=600s

  multi-validator-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Run multi-validator recovery, migration, slashing, rotation, state-sync, backup/restore, identity-recovery, and upgrade/rollback harnesses
        env:
          TRUEREPUBLIC_MULTI_VALIDATOR_SMOKE: '1'
        run: go test . -run '^(TestMultiValidatorConsensusRecovery|TestMultiValidatorLegacyAuthorityMigrationRollback|TestMultiValidatorConsensusSlashing|TestMultiValidatorConsensusKeyRotation|TestMultiValidatorTrustedSnapshotStateSync|TestMultiValidatorBackupRestoreExportImport|TestMultiValidatorPersistedBinaryUpgradeRollback|TestValidatorIdentityColdFailover)$' -count=1 -timeout=1500s -v

  docker-restart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

      - name: Build node image
        run: docker build --build-arg VERSION="${GITHUB_SHA}" --tag truerepublic-node:ci .

      - name: Start node container
        run: >-
          docker run --detach --name truerepublic-node-ci
          -e BOOTSTRAP_OPERATOR=truerepublic13hgqwy9986x5nk6jt23ns5v7j0acs8qmhchhtw
          truerepublic-node:ci

      - name: Wait for node liveness
        run: |
          for attempt in $(seq 1 60); do
            if docker exec truerepublic-node-ci truerepublicd healthcheck live --timeout 2s; then
              exit 0
            fi
            sleep 2
          done
          docker logs truerepublic-node-ci
          exit 1

      - name: Wait for first committed block
        id: first
        run: |
          for attempt in $(seq 1 60); do
            if docker exec truerepublic-node-ci truerepublicd healthcheck ready --timeout 2s; then
              height=$(docker exec truerepublic-node-ci wget -qO- http://127.0.0.1:26657/status | jq -r '.result.sync_info.latest_block_height // 0' || true)
              if [ "${height:-0}" -ge 1 ]; then
                echo "height=${height}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs truerepublic-node-ci
          exit 1

      - name: Restart persistent container
        run: docker restart truerepublic-node-ci

      - name: Verify height advances after restart
        env:
          FIRST_HEIGHT: ${{ steps.first.outputs.height }}
        run: |
          for attempt in $(seq 1 60); do
            if docker exec truerepublic-node-ci truerepublicd healthcheck live --timeout 2s &&
              docker exec truerepublic-node-ci truerepublicd healthcheck ready --timeout 2s; then
              height=$(docker exec truerepublic-node-ci wget -qO- http://127.0.0.1:26657/status | jq -r '.result.sync_info.latest_block_height // 0' || true)
            else
              height=0
            fi
            if [ "${height:-0}" -gt "${FIRST_HEIGHT:-0}" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs truerepublic-node-ci
          exit 1

      - name: Show node logs on failure
        if: failure()
        run: docker logs truerepublic-node-ci || true

      - name: Remove node container
        if: always()
        run: docker rm --force truerepublic-node-ci || true

      - name: Start loopback Compose stack
        env:
          BOOTSTRAP_OPERATOR: truerepublic13hgqwy9986x5nk6jt23ns5v7j0acs8qmhchhtw
          GRAFANA_PASSWORD: ci-compose-validation-only
          PROMETHEUS_ENABLED: 'true'
        run: docker compose up --detach --build truerepublic-node web-wallet nginx prometheus grafana

      - name: Verify proxy and same-namespace metrics
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: |
          for attempt in $(seq 1 90); do
            rpc_ok=false
            wallet_ok=false
            metrics_ok=false
            grafana_ok=false
            live_ok=false
            ready_ok=false
            curl --fail --silent http://127.0.0.1:8080/rpc/status >/dev/null && rpc_ok=true
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && wallet_ok=true
            docker compose exec -T truerepublic-node truerepublicd healthcheck live --timeout 2s &&
              live_ok=true
            docker compose exec -T truerepublic-node truerepublicd healthcheck ready --timeout 2s &&
              ready_ok=true
            if curl --fail --silent http://127.0.0.1:9091/api/v1/targets |
              jq -e '.data.activeTargets[] | select(.labels.job == "truerepublic-node" and .health == "up")' >/dev/null; then
              metrics_ok=true
            fi
            curl --fail --silent http://127.0.0.1:3000/api/health |
              jq -e '.database == "ok"' >/dev/null && grafana_ok=true
            if [ "$rpc_ok" = true ] && [ "$wallet_ok" = true ] &&
              [ "$live_ok" = true ] && [ "$ready_ok" = true ] &&
              [ "$metrics_ok" = true ] && [ "$grafana_ok" = true ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop Compose stack
        if: always()
        env:
          GRAFANA_PASSWORD: ci-compose-validation-only
        run: docker compose down --volumes --remove-orphans
