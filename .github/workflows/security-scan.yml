name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install govulncheck
        run: |
          version=$(jq -er '.tools.govulncheck' configs/security/gates.json)
          GOBIN="${RUNNER_TEMP}/security-tools" \
            go install "golang.org/x/vuln/cmd/govulncheck@${version}"

      - name: Run govulncheck
        env:
          GOVULNCHECK_BIN: ${{ runner.temp }}/security-tools/govulncheck
        run: ./scripts/check-go-vulnerabilities.sh

      - name: Verify Go vulnerability failure semantics
        run: ./scripts/test-go-vulnerability-scan.sh

  go-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Verify module checksums
        run: go mod verify

      - name: Install staticcheck
        run: |
          version=$(jq -er '.tools.staticcheck' configs/security/gates.json)
          GOBIN="${RUNNER_TEMP}/security-tools" \
            go install "honnef.co/go/tools/cmd/staticcheck@${version}"

      - name: Run blocking Go static analysis
        env:
          STATICCHECK_BIN: ${{ runner.temp }}/security-tools/staticcheck
        run: ./scripts/check-static-analysis.sh

      - name: Verify repository security-gate contract
        run: go test . -run '^TestSecurityGateRepositoryContract$' -count=1

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install gitleaks
        run: |
          version=$(jq -er '.tools.gitleaks' configs/security/gates.json)
          GOBIN="${RUNNER_TEMP}/security-tools" \
            go install "github.com/zricethezav/gitleaks/v8@${version}"

      - name: Scan maintained repository tree
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-tools/gitleaks
        run: ./scripts/check-secret-scan.sh

      - name: Verify secret-scan failure semantics
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-tools/gitleaks
        run: ./scripts/test-secret-scan.sh

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: '1.95.0'

      - name: Install cargo-audit
        run: |
          version=$(jq -er '.tools.cargo_audit' ../configs/security/gates.json)
          cargo install cargo-audit --version "$version" --locked

      - name: Run cargo audit
        run: cargo audit

  node-audit-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm run audit:high

  web-wallet-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify retired legacy web client stays absent
        run: ./scripts/check-web-wallet-retirement.sh

  mobile-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify retired mobile client stays absent
        run: ./scripts/check-mobile-retirement.sh

  custom-query-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify retired custom query surface stays absent
        run: ./scripts/check-custom-query-retirement.sh
