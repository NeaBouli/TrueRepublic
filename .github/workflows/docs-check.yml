name: Docs Consistency Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'SECURITY.md'
      - '.github/SECURITY.md'
      - '.github/dependabot.yml'
      - 'client-web/**'
      - 'docs/**'
      - 'scripts/check-consistency.sh'
      - 'scripts/check-mobile-retirement.sh'
      - 'scripts/check-web-wallet-retirement.sh'
      - 'scripts/check-custom-query-retirement.sh'
      - 'mobile-wallet/**'
      - 'web-wallet/**'
      - '.github/workflows/docs-check.yml'
      - '.github/workflows/security-scan.yml'
      - 'wiki/**'
  # This workflow is a required status context. It must report on every pull
  # request so path-only source changes cannot remain stuck in an expected
  # state. Main pushes stay path-filtered to avoid redundant post-merge work.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Consistency
        run: ./scripts/check-consistency.sh
      - name: Check Mobile Retirement
        run: ./scripts/check-mobile-retirement.sh
      - name: Check Legacy Web Retirement
        run: ./scripts/check-web-wallet-retirement.sh
      - name: Check Legacy Custom Query Retirement
        run: ./scripts/check-custom-query-retirement.sh
