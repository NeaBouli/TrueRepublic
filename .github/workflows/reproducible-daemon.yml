name: Reproducible Linux Daemon

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Optional baseline run ID of an earlier workflow_dispatch execution of the same exact main commit for the GH-273 cross-run rebuild comparison'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'configs/build/deterministic-linux-daemon.json'
      - 'configs/build/reproducible-oci.json'
      - 'configs/release/**'
      - 'configs/security/gates.json'
      - 'releaseevidence/**'
      - 'cmd/release-evidence/**'
      - 'ocievidence/**'
      - 'cmd/oci-evidence/**'
      - 'genesisevidence/**'
      - 'cmd/genesis-evidence/**'
      - 'installlifecycle/**'
      - 'cmd/install-lifecycle/**'
      - 'INSTALLATION.md'
      - 'README.md'
      - 'RELEASE_NOTES_v0.3.0.md'
      - 'docs/DEPLOYMENT.md'
      - 'docs/node-operators/README.md'
      - 'docs/node-operators/installation/**'
      - 'docs/releases/**'
      - 'docs/status.json'
      - 'docs/LIMITATIONS.md'
      - 'docs/node-operators/operations/upgrades.md'
      - 'docs/developers/api-reference/abci-queries.md'
      - 'client-web/CHANGELOG.md'
      - 'scripts/check-mobile-retirement.sh'
      - 'scripts/check-web-wallet-retirement.sh'
      - 'scripts/build-deterministic-daemon.sh'
      - 'scripts/generate-release-evidence.sh'
      - 'scripts/test-release-evidence.sh'
      - 'scripts/verify-release-evidence.sh'
      - 'scripts/test-reproducible-oci.sh'
      - 'scripts/verify-reproducible-oci.sh'
      - 'scripts/test-deterministic-daemon.sh'
      - 'scripts/verify-deterministic-daemon.sh'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/docker-entrypoint.sh'
      - 'client-web/**'
      - 'client-web/Dockerfile'
      - 'client-web/package.json'
      - 'client-web/package-lock.json'
      - 'reproducible_oci_repository_test.go'
      - 'candidateevidence/**'
      - 'cmd/candidate-evidence/**'
      - 'testdata/candidateevidence/**'
      - 'scripts/generate-candidate-evidence.sh'
      - 'scripts/test-candidate-evidence.sh'
      - 'scripts/verify-candidate-evidence.sh'
      - 'release_candidate_repository_test.go'
      - 'configs/release/cross-run-rebuild.json'
      - 'crossrunevidence/**'
      - 'cmd/cross-run-evidence/**'
      - 'testdata/crossrunevidence/**'
      - 'scripts/generate-cross-run-evidence.sh'
      - 'scripts/test-cross-run-evidence.sh'
      - 'scripts/verify-cross-run-evidence.sh'
      - 'cross_run_repository_test.go'
      - '.github/workflows/reproducible-daemon.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'configs/build/deterministic-linux-daemon.json'
      - 'configs/build/reproducible-oci.json'
      - 'configs/release/**'
      - 'configs/security/gates.json'
      - 'releaseevidence/**'
      - 'cmd/release-evidence/**'
      - 'ocievidence/**'
      - 'cmd/oci-evidence/**'
      - 'genesisevidence/**'
      - 'cmd/genesis-evidence/**'
      - 'installlifecycle/**'
      - 'cmd/install-lifecycle/**'
      - 'INSTALLATION.md'
      - 'README.md'
      - 'RELEASE_NOTES_v0.3.0.md'
      - 'docs/DEPLOYMENT.md'
      - 'docs/node-operators/README.md'
      - 'docs/node-operators/installation/**'
      - 'docs/releases/**'
      - 'docs/status.json'
      - 'docs/LIMITATIONS.md'
      - 'docs/node-operators/operations/upgrades.md'
      - 'docs/developers/api-reference/abci-queries.md'
      - 'client-web/CHANGELOG.md'
      - 'scripts/check-mobile-retirement.sh'
      - 'scripts/check-web-wallet-retirement.sh'
      - 'scripts/build-deterministic-daemon.sh'
      - 'scripts/generate-release-evidence.sh'
      - 'scripts/test-release-evidence.sh'
      - 'scripts/verify-release-evidence.sh'
      - 'scripts/test-reproducible-oci.sh'
      - 'scripts/verify-reproducible-oci.sh'
      - 'scripts/test-deterministic-daemon.sh'
      - 'scripts/verify-deterministic-daemon.sh'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/docker-entrypoint.sh'
      - 'client-web/**'
      - 'client-web/Dockerfile'
      - 'client-web/package.json'
      - 'client-web/package-lock.json'
      - 'reproducible_oci_repository_test.go'
      - 'candidateevidence/**'
      - 'cmd/candidate-evidence/**'
      - 'testdata/candidateevidence/**'
      - 'scripts/generate-candidate-evidence.sh'
      - 'scripts/test-candidate-evidence.sh'
      - 'scripts/verify-candidate-evidence.sh'
      - 'release_candidate_repository_test.go'
      - 'configs/release/cross-run-rebuild.json'
      - 'crossrunevidence/**'
      - 'cmd/cross-run-evidence/**'
      - 'testdata/crossrunevidence/**'
      - 'scripts/generate-cross-run-evidence.sh'
      - 'scripts/test-cross-run-evidence.sh'
      - 'scripts/verify-cross-run-evidence.sh'
      - 'cross_run_repository_test.go'
      - '.github/workflows/reproducible-daemon.yml'

permissions:
  contents: read

jobs:
  release-evidence-contract:
    name: release evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: Install exact SBOM generators outside the repository
        run: |
          test "$(npm --version)" = "$(jq -er '.tools.npm' configs/security/gates.json)"
          GOBIN="${RUNNER_TEMP}/release-tools" \
            go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$(jq -er '.tools.cyclonedx_gomod' configs/security/gates.json)"
          npm install --global --prefix "${RUNNER_TEMP}/cyclonedx-npm" \
            "@cyclonedx/cyclonedx-npm@$(jq -er '.tools.cyclonedx_npm' configs/security/gates.json)"

      - name: Generate each maintained-source SBOM twice
        run: |
          "${RUNNER_TEMP}/release-tools/cyclonedx-gomod" mod -json -output-version 1.6 -output "${RUNNER_TEMP}/go-a.json" .
          "${RUNNER_TEMP}/release-tools/cyclonedx-gomod" mod -json -output-version 1.6 -output "${RUNNER_TEMP}/go-b.json" .
          "${RUNNER_TEMP}/cyclonedx-npm/bin/cyclonedx-npm" --package-lock-only --spec-version 1.6 --output-format JSON --output-file "${RUNNER_TEMP}/client-a.json" client-web/package.json
          "${RUNNER_TEMP}/cyclonedx-npm/bin/cyclonedx-npm" --package-lock-only --spec-version 1.6 --output-format JSON --output-file "${RUNNER_TEMP}/client-b.json" client-web/package.json
          for component in go client; do
            jq -cS 'del(.serialNumber, .metadata.timestamp)' "${RUNNER_TEMP}/${component}-a.json" >"${RUNNER_TEMP}/${component}-normalized-a.json"
            jq -cS 'del(.serialNumber, .metadata.timestamp)' "${RUNNER_TEMP}/${component}-b.json" >"${RUNNER_TEMP}/${component}-normalized-b.json"
            cmp "${RUNNER_TEMP}/${component}-normalized-a.json" "${RUNNER_TEMP}/${component}-normalized-b.json"
          done

      - name: Verify fail-closed release-evidence fixtures offline
        run: ./scripts/test-release-evidence.sh

      - name: Verify fail-closed install lifecycle offline
        run: |
          make install-lifecycle-contract-test
          go test . -run '^TestInstallLifecycleRepositoryContract$' -count=1

      - name: Verify release notes and compatibility contract
        run: make release-compatibility-contract-test

      - name: Verify rollout genesis qualification contract
        run: make rollout-genesis-contract-test

      - name: Verify fail-closed cross-run evidence contract offline
        run: make cross-run-evidence-contract-test

  deterministic-build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Test deterministic build contract
        run: ./scripts/test-deterministic-daemon.sh

      - name: Build twice and verify identical daemon
        run: >-
          make deterministic-linux-daemon
          DETERMINISTIC_TARGET=${{ matrix.target }}
          SOURCE_REF=${GITHUB_SHA}
          DETERMINISTIC_OUT=${RUNNER_TEMP}/truerepublic-${{ matrix.target }}

      - name: Upload repository-only build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: truerepublic-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/truerepublic-${{ matrix.target }}/CHECKSUMS.sha256
            ${{ runner.temp }}/truerepublic-${{ matrix.target }}/build-metadata.json
          if-no-files-found: error
          retention-days: 14

  reproducible-oci:
    name: reproducible OCI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            runner_arch: x86_64
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: aarch64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Verify fail-closed OCI evidence contract offline
        run: make reproducible-oci-contract-test

      - name: Build each maintained image twice and verify OCI identity
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          PLATFORM_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          contract=configs/build/reproducible-oci.json
          source_ref=$(git rev-parse HEAD)
          source_date_epoch=$(git show -s --format=%ct HEAD)
          actual_arch=$(uname -m)
          test "$actual_arch" = "$EXPECTED_RUNNER_ARCH"
          test "$(jq -r --arg platform "$EXPECTED_PLATFORM" '[.targets[] | select(.platform == $platform)] | length' "$contract")" = "2"
          test "$(jq -r '.repetitions' "$contract")" = "2"
          docker buildx version
          builder="tr-oci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PLATFORM_SUFFIX}"
          cleanup() { docker buildx rm "$builder" >/dev/null 2>&1 || true; }
          trap cleanup EXIT HUP INT TERM
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --builder "$builder" --bootstrap

          evidence="${RUNNER_TEMP}/oci-evidence-${PLATFORM_SUFFIX}"
          mkdir -p "$evidence"
          mapfile -t target_ids < <(jq -r --arg platform "$EXPECTED_PLATFORM" '.targets[] | select(.platform == $platform) | .id' "$contract")
          for target_id in "${target_ids[@]}"; do
            dockerfile=$(jq -r --arg id "$target_id" '.targets[] | select(.id == $id) | .dockerfile' "$contract")
            context=$(jq -r --arg id "$target_id" '.targets[] | select(.id == $id) | .context' "$contract")
            declared_platform=$(jq -r --arg id "$target_id" '.targets[] | select(.id == $id) | .platform' "$contract")
            test "$declared_platform" = "$EXPECTED_PLATFORM"
            for repetition in 1 2; do
              archive="${evidence}/${target_id}-${repetition}.oci.tar"
              build_args=(--build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}")
              if jq -e --arg id "$target_id" '.targets[] | select(.id == $id) | .build_args.VERSION == "{{source_ref}}"' "$contract" >/dev/null; then
                build_args+=(--build-arg "VERSION=${source_ref}")
              fi
              docker buildx build \
                --builder "$builder" \
                --no-cache \
                --pull \
                --provenance=false \
                --sbom=false \
                --platform "$declared_platform" \
                "${build_args[@]}" \
                --output "type=oci,dest=${archive},rewrite-timestamp=true" \
                --file "$dockerfile" \
                "$context"
            done
          done

          targets='[]'
          for target_id in "${target_ids[@]}"; do
            builds='[]'
            for repetition in 1 2; do
              file="${target_id}-${repetition}.oci.tar"
              digest=$(sha256sum "${evidence}/${file}" | awk '{print $1}')
              builds=$(jq -cn --argjson prior "$builds" --arg file "$file" --arg digest "$digest" '$prior + [{file:$file,sha256:$digest}]')
            done
            targets=$(jq -cn --argjson prior "$targets" --arg id "$target_id" --argjson builds "$builds" '$prior + [{id:$id,builds:$builds}]')
          done
          contract_digest=$(sha256sum "$contract" | awk '{print $1}')
          jq -n -S \
            --arg source_ref "$source_ref" \
            --arg contract_digest "$contract_digest" \
            --arg platform "$EXPECTED_PLATFORM" \
            --argjson targets "$targets" \
            '{schema:"truerepublic.oci-evidence/v1",source_ref:$source_ref,contract_sha256:$contract_digest,platform:$platform,claims:{signed:false,published:false,production:false},targets:$targets}' \
            >"${evidence}/oci-evidence.json"
          ./scripts/verify-reproducible-oci.sh --evidence "$evidence" --output json | tee "${evidence}/oci-evidence-report-${PLATFORM_SUFFIX}.json"

      - name: Upload repository-only OCI digest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: truerepublic-oci-${{ matrix.suffix }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oci-evidence-${{ matrix.suffix }}/oci-evidence.json
            ${{ runner.temp }}/oci-evidence-${{ matrix.suffix }}/oci-evidence-report-${{ matrix.suffix }}.json
          if-no-files-found: error
          retention-days: 14

  candidate-evidence:
    name: release candidate evidence
    needs: [deterministic-build, reproducible-oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Download deterministic amd64 metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truerepublic-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-input/truerepublic-linux-amd64

      - name: Download deterministic arm64 metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truerepublic-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-input/truerepublic-linux-arm64

      - name: Download OCI amd64 digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truerepublic-oci-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-input/truerepublic-oci-amd64

      - name: Download OCI arm64 digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truerepublic-oci-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-input/truerepublic-oci-arm64

      - name: Verify fail-closed candidate evidence contract offline
        run: ./scripts/test-candidate-evidence.sh

      - name: Assemble and verify simulated-tag candidate evidence
        env:
          CANDIDATE_TAG: v0.5.0
        run: |
          set -euo pipefail
          ./scripts/generate-candidate-evidence.sh \
            --tag "$CANDIDATE_TAG" \
            --commit "$GITHUB_SHA" \
            --amd64-dir "${RUNNER_TEMP}/candidate-input/truerepublic-linux-amd64" \
            --arm64-dir "${RUNNER_TEMP}/candidate-input/truerepublic-linux-arm64" \
            --oci-amd64-dir "${RUNNER_TEMP}/candidate-input/truerepublic-oci-amd64" \
            --oci-arm64-dir "${RUNNER_TEMP}/candidate-input/truerepublic-oci-arm64" \
            --output-dir "${RUNNER_TEMP}/candidate-evidence"
          ./scripts/verify-candidate-evidence.sh \
            --evidence "${RUNNER_TEMP}/candidate-evidence" \
            --output json | tee "${RUNNER_TEMP}/candidate-evidence-report.json"
          mkdir "${RUNNER_TEMP}/candidate-artifact"
          cp "${RUNNER_TEMP}/candidate-evidence/candidate-evidence.json" \
            "${RUNNER_TEMP}/candidate-artifact/candidate-evidence.json"
          cp "${RUNNER_TEMP}/candidate-evidence-report.json" \
            "${RUNNER_TEMP}/candidate-artifact/candidate-evidence-report.json"
          test "$(find "${RUNNER_TEMP}/candidate-artifact" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload repository-only candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: truerepublic-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate-artifact/candidate-evidence.json
            ${{ runner.temp }}/candidate-artifact/candidate-evidence-report.json
          if-no-files-found: error
          retention-days: 14

  cross-run-comparison:
    name: cross-run rebuild comparison
    needs: [candidate-evidence]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.baseline_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Guard and bind the baseline run
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ github.event.inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          test "$BASELINE_RUN_ID" != "$GITHUB_RUN_ID"
          contract=configs/release/cross-run-rebuild.json
          test "$(jq -er '.schema' "$contract")" = "truerepublic.cross-run-rebuild/v1"
          workflow_path=$(jq -er '.source.workflow_path' "$contract")
          test "$workflow_path" = ".github/workflows/reproducible-daemon.yml"
          test "$(jq -er '.source.repository' "$contract")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.source.branch' "$contract")" = "main"
          test "$(jq -er '.source.event' "$contract")" = "workflow_dispatch"
          test "$(jq -er '.source.retention_days' "$contract")" = "14"
          run_json="${RUNNER_TEMP}/baseline-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID" >"$run_json"
          test "$(jq -er '.repository.full_name' "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.path' "$run_json")" = "$workflow_path"
          test "$(jq -er '.head_branch' "$run_json")" = "main"
          test "$(jq -er '.event' "$run_json")" = "workflow_dispatch"
          test "$(jq -er '.head_sha' "$run_json")" = "$GITHUB_SHA"
          test "$(jq -er '.status' "$run_json")" = "completed"
          test "$(jq -er '.conclusion' "$run_json")" = "success"
          baseline_created=$(jq -er '.created_at' "$run_json")
          baseline_epoch=$(date -u -d "$baseline_created" +%s)
          now_epoch=$(date -u +%s)
          test "$baseline_epoch" -le "$now_epoch"
          test $((now_epoch - baseline_epoch)) -le 1209600
          artifact_name="truerepublic-candidate-$GITHUB_SHA"
          artifacts_json="${RUNNER_TEMP}/baseline-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID/artifacts?name=$artifact_name&per_page=100" >"$artifacts_json"
          test "$(jq -er '.total_count' "$artifacts_json")" = "1"
          test "$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))] | length' "$artifacts_json")" = "1"
          mkdir -p "${RUNNER_TEMP}/cross-run-receipts"
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path "$workflow_path" \
            --arg run_id "$BASELINE_RUN_ID" \
            --argjson run_attempt "$(jq -er '.run_attempt' "$run_json")" \
            --arg head_sha "$GITHUB_SHA" \
            --arg created_at "$baseline_created" \
            --arg artifact_name "$artifact_name" \
            --argjson artifact_id "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].id' "$artifacts_json")" \
            --arg artifact_digest "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].digest' "$artifacts_json")" \
            --arg artifact_created_at "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].created_at' "$artifacts_json")" \
            --arg artifact_expires_at "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].expires_at' "$artifacts_json")" \
            '{schema:"truerepublic.cross-run-receipt/v1",repository:$repository,workflow_path:$workflow_path,branch:"main",event:"workflow_dispatch",run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,created_at:$created_at,status:"completed",conclusion:"success",artifact:{name:$artifact_name,id:$artifact_id,digest:$artifact_digest,created_at:$artifact_created_at,expires_at:$artifact_expires_at,expired:false}}' \
            >"${RUNNER_TEMP}/cross-run-receipts/receipt-baseline.json"

      - name: Bind the current run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_path=$(jq -er '.source.workflow_path' configs/release/cross-run-rebuild.json)
          run_json="${RUNNER_TEMP}/current-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >"$run_json"
          test "$(jq -er '.repository.full_name' "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.path' "$run_json")" = "$workflow_path"
          test "$(jq -er '.head_branch' "$run_json")" = "main"
          test "$(jq -er '.event' "$run_json")" = "workflow_dispatch"
          test "$(jq -er '.head_sha' "$run_json")" = "$GITHUB_SHA"
          test "$(jq -er '.status' "$run_json")" = "in_progress"
          test "$(jq -r '.conclusion' "$run_json")" = "null"
          artifact_name="truerepublic-candidate-$GITHUB_SHA"
          artifacts_json="${RUNNER_TEMP}/current-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$artifact_name&per_page=100" >"$artifacts_json"
          test "$(jq -er '.total_count' "$artifacts_json")" = "1"
          test "$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))] | length' "$artifacts_json")" = "1"
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path "$workflow_path" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_sha "$GITHUB_SHA" \
            --arg created_at "$(jq -er '.created_at' "$run_json")" \
            --arg artifact_name "$artifact_name" \
            --argjson artifact_id "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].id' "$artifacts_json")" \
            --arg artifact_digest "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].digest' "$artifacts_json")" \
            --arg artifact_created_at "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].created_at' "$artifacts_json")" \
            --arg artifact_expires_at "$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))][0].expires_at' "$artifacts_json")" \
            '{schema:"truerepublic.cross-run-receipt/v1",repository:$repository,workflow_path:$workflow_path,branch:"main",event:"workflow_dispatch",run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,created_at:$created_at,status:"in_progress",conclusion:"",artifact:{name:$artifact_name,id:$artifact_id,digest:$artifact_digest,created_at:$artifact_created_at,expires_at:$artifact_expires_at,expired:false}}' \
            >"${RUNNER_TEMP}/cross-run-receipts/receipt-current.json"

      - name: Download baseline candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truerepublic-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cross-run-input/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.baseline_run_id }}
          digest-mismatch: error

      - name: Download current candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truerepublic-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cross-run-input/current
          digest-mismatch: error

      - name: Verify fail-closed cross-run evidence contract offline
        run: ./scripts/test-cross-run-evidence.sh

      - name: Assemble and compare cross-run rebuild evidence
        env:
          BASELINE_RUN_ID: ${{ github.event.inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          workflow_path=$(jq -er '.source.workflow_path' configs/release/cross-run-rebuild.json)
          ./scripts/generate-cross-run-evidence.sh \
            --baseline-receipt "${RUNNER_TEMP}/cross-run-receipts/receipt-baseline.json" \
            --current-receipt "${RUNNER_TEMP}/cross-run-receipts/receipt-current.json" \
            --baseline-dir "${RUNNER_TEMP}/cross-run-input/baseline" \
            --current-dir "${RUNNER_TEMP}/cross-run-input/current" \
            --output-dir "${RUNNER_TEMP}/cross-run-evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-path "$workflow_path" \
            --branch main \
            --commit "$GITHUB_SHA" \
            --baseline-run-id "$BASELINE_RUN_ID" \
            --current-run-id "$GITHUB_RUN_ID"
          ./scripts/verify-cross-run-evidence.sh \
            --evidence "${RUNNER_TEMP}/cross-run-evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-path "$workflow_path" \
            --branch main \
            --commit "$GITHUB_SHA" \
            --baseline-run-id "$BASELINE_RUN_ID" \
            --current-run-id "$GITHUB_RUN_ID" \
            --output json | tee "${RUNNER_TEMP}/cross-run-report.json"

      - name: Upload repository-only cross-run comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: truerepublic-cross-run-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cross-run-evidence/cross-run-evidence.json
            ${{ runner.temp }}/cross-run-evidence/receipt-baseline.json
            ${{ runner.temp }}/cross-run-evidence/receipt-current.json
            ${{ runner.temp }}/cross-run-evidence/candidate-manifest-baseline.json
            ${{ runner.temp }}/cross-run-evidence/candidate-report-baseline.json
            ${{ runner.temp }}/cross-run-evidence/candidate-manifest-current.json
            ${{ runner.temp }}/cross-run-evidence/candidate-report-current.json
            ${{ runner.temp }}/cross-run-report.json
          if-no-files-found: error
          retention-days: 14
