# GH-219 community licensing decision (see configs/legal/license-decision.json
# and docs/legal/GH-219-LICENSE-DECISION.md): maintained source code and
# maintained documentation are Apache-2.0. Individual contributors retain
# copyright; "TrueRepublic contributors" is the collective attribution.
#
# Deliberately not annotated here (excluded until provenance is documented):
# brand assets and artwork (assets/**, docs/assets/**), historical PDFs
# (*.pdf), archived/historical evidence (docs/archive/**,
# RELEASE_NOTES_v0.3.0.md, client-web/CHANGELOG.md, audit/evidence records),
# the unmaintained ui/** prototype, generated lockfiles/checksums, and
# third-party material. This is a REUSE-compatible scope declaration; it does
# not claim full REUSE compliance for deliberately excluded material.

[[annotations]]
