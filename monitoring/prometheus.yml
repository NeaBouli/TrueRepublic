global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # CometBFT node metrics (port 26660 when prometheus=true in config.toml)
  - job_name: 'truerepublic-node'
    static_configs:
      - targets: ['127.0.0.1:26660']

  # Cosmos SDK/runtime and bounded TrueRepublic application metrics.
  - job_name: 'truerepublic-app'
    metrics_path: '/metrics'
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['127.0.0.1:1317']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
