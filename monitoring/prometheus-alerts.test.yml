rule_files:
  - prometheus-alerts.yml

evaluation_interval: 1m

tests:
  - name: node target down transitions from inactive to firing and recovery
    interval: 1m
    input_series:
      - series: 'up{job="truerepublic-node",instance="127.0.0.1:26660"}'
        values: '1x2 0x5 1x2'
    alert_rule_test:
      - eval_time: 2m
        alertname: TrueRepublicNodeTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: TrueRepublicNodeTargetDown
        exp_alerts:
          - exp_labels:
              instance: "127.0.0.1:26660"
              job: "truerepublic-node"
              owner: node-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic CometBFT metrics target is unavailable"
              description: "Prometheus cannot scrape the private CometBFT metrics target."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#target-unavailable"
      - eval_time: 9m
        alertname: TrueRepublicNodeTargetDown
        exp_alerts: []

  - name: reachable target cannot hide a missing required metric family
    interval: 1m
    input_series:
      - series: 'up{job="truerepublic-app",instance="127.0.0.1:1317"}'
        values: '1x5'
      - series: 'cometbft_consensus_height{job="truerepublic-node"}'
        values: '_ _ _ 10x2'
      - series: 'cometbft_mempool_size{job="truerepublic-node"}'
        values: '_ _ _ 0x2'
      - series: 'cometbft_consensus_missing_validators{job="truerepublic-node"}'
        values: '_ _ _ 0x2'
      - series: 'truerepublic_app_last_successful_block_height{job="truerepublic-app"}'
        values: '_ _ _ 10x2'
      - series: 'truerepublic_app_completed_blocks_total{job="truerepublic-app"}'
        values: '_ _ _ 10x2'
      - series: 'truerepublic_app_last_successful_invariant_cycle_height{job="truerepublic-app"}'
        values: '_ _ _ 10x2'
      - series: 'truerepublic_token_pnyx_supply_base_units{job="truerepublic-app"}'
        values: '_ _ _ 100x2'
      - series: 'truerepublic_token_pnyx_supply_headroom_base_units{job="truerepublic-app"}'
        values: '_ _ _ 20999999999900x2'
    alert_rule_test:
      - eval_time: 1m
        alertname: TrueRepublicRequiredMetricMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: TrueRepublicRequiredMetricMissing
        exp_alerts:
          - exp_labels:
              job: "truerepublic-node"
              owner: observability-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic required metrics contract is incomplete"
              description: "At least one required CometBFT or application metric family is absent even if its scrape target remains reachable."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#required-metric-missing"
          - exp_labels:
              job: "truerepublic-app"
              owner: observability-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic required metrics contract is incomplete"
              description: "At least one required CometBFT or application metric family is absent even if its scrape target remains reachable."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#required-metric-missing"
      - eval_time: 4m
        alertname: TrueRepublicRequiredMetricMissing
        exp_alerts: []

  - name: consensus stall transitions from advancing to firing and recovery
    interval: 1m
    input_series:
      - series: 'cometbft_consensus_height{job="truerepublic-node",instance="127.0.0.1:26660"}'
        values: '100+1x5 105x8 106+1x3'
    alert_rule_test:
      - eval_time: 9m
        alertname: TrueRepublicConsensusStalled
        exp_alerts: []
      - eval_time: 12m
        alertname: TrueRepublicConsensusStalled
        exp_alerts:
          - exp_labels:
              instance: "127.0.0.1:26660"
              job: "truerepublic-node"
              owner: validator-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic consensus height is not advancing"
              description: "The observed consensus height has not changed for the configured recovery/testnet window."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#consensus-or-application-progress-stalled"
      - eval_time: 15m
        alertname: TrueRepublicConsensusStalled
        exp_alerts: []

  - name: application target down transitions from inactive to firing and recovery
    interval: 1m
    input_series:
      - series: 'up{job="truerepublic-app",instance="127.0.0.1:1317"}'
        values: '1x2 0x5 1x2'
    alert_rule_test:
      - eval_time: 2m
        alertname: TrueRepublicApplicationTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: TrueRepublicApplicationTargetDown
        exp_alerts:
          - exp_labels:
              instance: "127.0.0.1:1317"
              job: "truerepublic-app"
              owner: protocol-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic application metrics target is unavailable"
              description: "Prometheus cannot scrape the private SDK and application metrics target."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#target-unavailable"
      - eval_time: 9m
        alertname: TrueRepublicApplicationTargetDown
        exp_alerts: []

  - name: application progress stall fires and recovers
    interval: 1m
    input_series:
      - series: 'truerepublic_app_completed_blocks_total{job="truerepublic-app",instance="127.0.0.1:1317"}'
        values: '100+1x5 105x8 106+1x3'
    alert_rule_test:
      - eval_time: 9m
        alertname: TrueRepublicApplicationStalled
        exp_alerts: []
      - eval_time: 12m
        alertname: TrueRepublicApplicationStalled
        exp_alerts:
          - exp_labels:
              instance: "127.0.0.1:1317"
              job: "truerepublic-app"
              owner: protocol-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic application EndBlock progress is stalled"
              description: "The successful application block counter has not changed for the configured recovery/testnet window."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#consensus-or-application-progress-stalled"
      - eval_time: 15m
        alertname: TrueRepublicApplicationStalled
        exp_alerts: []

  - name: consensus and application divergence fires and recovers
    interval: 1m
    input_series:
      - series: 'cometbft_consensus_height{job="truerepublic-node",node="validator-a"}'
        values: '100x14'
      - series: 'truerepublic_app_last_successful_block_height{job="truerepublic-app",node="validator-a"}'
        values: '100x2 90x8 100x2'
    alert_rule_test:
      - eval_time: 7m
        alertname: TrueRepublicApplicationConsensusDivergence
        exp_alerts: []
      - eval_time: 8m
        alertname: TrueRepublicApplicationConsensusDivergence
        exp_alerts:
          - exp_labels:
              node: "validator-a"
              owner: protocol-operator
              severity: warning
            exp_annotations:
              summary: "TrueRepublic consensus and application heights diverge"
              description: "The private CometBFT and application height signals differ by more than five blocks."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#application-divergence-or-invariant-lag"
      - eval_time: 12m
        alertname: TrueRepublicApplicationConsensusDivergence
        exp_alerts: []

  - name: invariant lag is critical until heights realign
    interval: 1m
    input_series:
      - series: 'truerepublic_app_last_successful_block_height{job="truerepublic-app"}'
        values: '100+1x10 110x5'
      - series: 'truerepublic_app_last_successful_invariant_cycle_height{job="truerepublic-app"}'
        values: '100+1x5 105x4 110x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: TrueRepublicInvariantLag
        exp_alerts: []
      - eval_time: 7m
        alertname: TrueRepublicInvariantLag
        exp_alerts:
          - exp_labels:
              job: "truerepublic-app"
              owner: protocol-security
              severity: critical
            exp_annotations:
              summary: "TrueRepublic invariant cycle lags application progress"
              description: "The last successful invariant-cycle height is behind the last successful application height."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#application-divergence-or-invariant-lag"
      - eval_time: 11m
        alertname: TrueRepublicInvariantLag
        exp_alerts: []

  - name: missing validator alert fires and recovers
    interval: 1m
    input_series:
      - series: 'cometbft_consensus_missing_validators{job="truerepublic-node"}'
        values: '0x2 1x4 0x2'
    alert_rule_test:
      - eval_time: 4m
        alertname: TrueRepublicMissingValidators
        exp_alerts: []
      - eval_time: 5m
        alertname: TrueRepublicMissingValidators
        exp_alerts:
          - exp_labels:
              job: "truerepublic-node"
              owner: validator-operator
              severity: critical
            exp_annotations:
              summary: "TrueRepublic reports missing validators"
              description: "CometBFT reports at least one validator missing from consensus participation."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#validator-peer-or-mempool-degradation"
      - eval_time: 8m
        alertname: TrueRepublicMissingValidators
        exp_alerts: []

  - name: mempool pressure alert fires and recovers
    interval: 1m
    input_series:
      - series: 'cometbft_mempool_size{job="truerepublic-node"}'
        values: '0x2 1500x11 0x2'
    alert_rule_test:
      - eval_time: 12m
        alertname: TrueRepublicMempoolPressure
        exp_alerts: []
      - eval_time: 13m
        alertname: TrueRepublicMempoolPressure
        exp_alerts:
          - exp_labels:
              job: "truerepublic-node"
              owner: node-operator
              severity: warning
            exp_annotations:
              summary: "TrueRepublic mempool pressure is sustained"
              description: "The CometBFT mempool has remained above 1000 transactions."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#validator-peer-or-mempool-degradation"
      - eval_time: 15m
        alertname: TrueRepublicMempoolPressure
        exp_alerts: []

  - name: PNYX cap integrity breach fires and recovers
    interval: 1m
    input_series:
      - series: 'truerepublic_token_pnyx_supply_base_units{job="truerepublic-app"}'
        values: '21000000000000x2 21000000000001x2 21000000000000x2'
      - series: 'truerepublic_token_pnyx_supply_headroom_base_units{job="truerepublic-app"}'
        values: '0x2 -1x2 0x2'
    alert_rule_test:
      - eval_time: 3m
        alertname: TrueRepublicPNYXCapIntegrityBreach
        exp_alerts: []
      - eval_time: 4m
        alertname: TrueRepublicPNYXCapIntegrityBreach
        exp_alerts:
          - exp_labels:
              job: "truerepublic-app"
              owner: protocol-security
              severity: critical
            exp_annotations:
              summary: "TrueRepublic PNYX fixed-cap integrity is breached"
              description: "Canonical PNYX supply exceeds the cap, headroom is negative, or supply plus headroom no longer equals the exact cap."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#pnyx-cap-or-headroom-breach"
      - eval_time: 6m
        alertname: TrueRepublicPNYXCapIntegrityBreach
        exp_alerts: []

  - name: absent CometBFT peer gauge is treated as zero peers
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 9m
        alertname: TrueRepublicLowPeerCount
        exp_alerts: []
      - eval_time: 10m
        alertname: TrueRepublicLowPeerCount
        exp_alerts:
          - exp_labels:
              owner: network-operator
              severity: warning
            exp_annotations:
              summary: "TrueRepublic peer count is below the recovery/testnet default"
              description: "The node has fewer than three peers or the peer gauge has not yet been instantiated."
              runbook_url: "https://github.com/NeaBouli/TrueRepublic/blob/main/docs/node-operators/operations/monitoring.md#validator-peer-or-mempool-degradation"
